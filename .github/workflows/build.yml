name: Build AndroidIDE with AI assistant

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (to get inject-ai.sh)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # الريبو فيه submodule (logback-android) => لازم --recurse-submodules
      # ما كنستعملوش --depth 1 حيث المشروع كيستعمل plugin Nyx اللي كيحتاج تاريخ git
      - name: Clone AndroidIDE
        run: git clone --recurse-submodules https://github.com/AndroidIDEOfficial/AndroidIDE.git AndroidIDE

      - name: Inject AI assistant
        run: |
          test -f inject-ai.sh || { echo "inject-ai.sh ماكاينش فجذر الريبو"; ls -la; exit 1; }
          bash inject-ai.sh AndroidIDE
          echo "--- الملفات المعدّلة:"
          git -C AndroidIDE status --short | head -20

      # sora-editor 0.23.4-ce8de8e-SNAPSHOT ما بقاش منشور => نستعملو النسخة المستقرة 0.23.5
      - name: Replace unavailable SNAPSHOT dependencies
        run: |
          cd AndroidIDE
          files="$(grep -rlE "0\.23\.4-ce8de8e-SNAPSHOT|4\.0\.1-internal\.1" --include=*.toml --include=*.kts --include=*.kt --include=*.gradle --exclude-dir=build --exclude-dir=.git . || true)"
          if [ -n "$files" ]; then
            echo "$files"
            echo "$files" | xargs sed -i -E \
              -e 's/0\.23\.4-ce8de8e-SNAPSHOT/0.23.5/g' \
              -e 's/4\.0\.1-internal\.1[^"]*SNAPSHOT/4.0.1/g'
          else
            echo "ما لقيتش dependencies SNAPSHOT، نتخطّاو"
          fi
          echo "--- sora-editor version now:"
          grep -rn "^editor = " gradle/libs.versions.toml || true

      # jakarta.servlet-api كيتحل أحيانا لنسخة 6.2.0-M1 مكسورة => نثبّتو على 6.1.0
      - name: Pin jakarta.servlet-api
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/pin-deps.gradle <<'EOF'
          allprojects {
            configurations.all {
              resolutionStrategy.eachDependency { d ->
                if (d.requested.group == 'jakarta.servlet' && d.requested.name == 'jakarta.servlet-api') {
                  d.useVersion('6.1.0')
                }
              }
            }
          }
          EOF

      - name: Install Android SDK pieces
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      # AGP كيقلب على debug.keystore فـ ~/.config/.android (مماشي ~/.android)
      # => نصاوبوه بصيغة JKS فجوج المسارات باش يتفادى تعارض BouncyCastle
      - name: Create debug keystore
        run: |
          for d in "$HOME/.android" "$HOME/.config/.android"; do
            mkdir -p "$d"
            rm -f "$d/debug.keystore"
            keytool -genkeypair -keystore "$d/debug.keystore" \
              -storetype JKS \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            ls -la "$d"
          done

      # مفتاح GPG ديال packages.androidide.com سالا => apt update كيفشل فأول تشغيل
      # => نزيدو [trusted=yes] فـ sources.list داخل bootstrap-*.zip
      # (الـ zip كيتحمل وقت البناء، فكنشغلو watcher فالخلفية كيصحّحو أول ما يبان)
      - name: Prepare bootstrap patch (expired GPG key)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/patch-bootstrap.py <<'EOF'
          import os, re, sys, zipfile

          root = sys.argv[1]
          verbose = "-v" in sys.argv[2:]

          def fix(text):
              text = re.sub(r"^(deb(?:-src)?)[ \t]+(?!\[)", r"\1 [trusted=yes] ", text, flags=re.M)
              text = re.sub(r"^(deb(?:-src)?[ \t]+\[)(?![^\]]*trusted=)", r"\1trusted=yes ", text, flags=re.M)
              return text

          def is_apt_list(n):
              return n.startswith("etc/apt/") and n.endswith(".list")

          def needs_patch(path):
              try:
                  with zipfile.ZipFile(path) as z:
                      for n in z.namelist():
                          if is_apt_list(n):
                              t = z.read(n).decode("utf-8", "replace")
                              if fix(t) != t:
                                  return True
              except Exception as e:
                  if verbose:
                      print("skip", path, e)
              return False

          def patch(path):
              tmp = path + ".tmp"
              try:
                  with zipfile.ZipFile(path) as zin, zipfile.ZipFile(tmp, "w") as zout:
                      for item in zin.infolist():
                          data = zin.read(item.filename)
                          if is_apt_list(item.filename):
                              old = data.decode("utf-8")
                              new = fix(old)
                              if new != old:
                                  data = new.encode("utf-8")
                                  print("  patched:", item.filename)
                          zout.writestr(item, data)
                  os.replace(tmp, path)
                  print("PATCHED " + path)
              except Exception as e:
                  print("FAILED", path, e)
                  if os.path.exists(tmp):
                      os.remove(tmp)

          found = 0
          for d, dirs, files in os.walk(root):
              dirs[:] = [x for x in dirs if x not in (".git", ".gradle", "node_modules")]
              for f in files:
                  if f.startswith("bootstrap") and f.endswith(".zip"):
                      found += 1
                      full = os.path.join(d, f)
                      if needs_patch(full):
                          patch(full)
                      elif verbose:
                          print("OK(no change) " + full)
          if verbose:
              print("bootstrap zips found:", found)
          EOF

          cat > ~/.gradle/init.d/patch-bootstrap.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (!t.project.path.contains('termux')) return
              def n = t.name.toLowerCase()
              def run = { ->
                def pb = new ProcessBuilder('python3', System.getProperty('user.home') + '/patch-bootstrap.py', t.project.rootDir.absolutePath)
                pb.inheritIO().start().waitFor()
              }
              if (n.contains('bootstrap')) {
                t.doLast { run() }
              } else if (n.startsWith('configurecmake') || n.startsWith('buildcmake') || n.startsWith('externalnativebuild') || n.contains('assets')) {
                t.doFirst { run() }
              }
            }
          }
          EOF

          python3 ~/patch-bootstrap.py AndroidIDE -v

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('AndroidIDE/**/*.gradle*', 'AndroidIDE/**/gradle-wrapper.properties', 'AndroidIDE/**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          cd AndroidIDE
          chmod +x gradlew
          # watcher: كيصحّح bootstrap-*.zip كل 3 ثواني فالخلفية طول البناء
          ( while true; do python3 ~/patch-bootstrap.py "$PWD" >> ~/bootstrap-watch.log 2>&1; sleep 3; done ) &
          WATCH=$!
          trap 'kill "$WATCH" 2>/dev/null || true' EXIT
          ./gradlew :core:app:assembleDebug -x :core:app:validateSigningDebug \
            --no-daemon --console=plain 2>&1 | tee build.log

      # تشخيص: واش الـ bootstrap تصحّح فعلا؟
      - name: Verify bootstrap patch
        if: always()
        run: |
          echo "===== watcher log ====="
          sort ~/bootstrap-watch.log 2>/dev/null | uniq -c | head -20 || true
          echo "===== PATCHED lines in build.log ====="
          grep -n "PATCHED\|patched:" AndroidIDE/build.log | head -20 || true
          echo "===== bootstrap zips on disk ====="
          cd AndroidIDE
          find . -name 'bootstrap*.zip' -not -path './.git/*' | while read -r z; do
            echo "== $z"
            unzip -p "$z" etc/apt/sources.list 2>/dev/null || echo "(no etc/apt/sources.list)"
          done

      # ملخص قصير للخطأ فآخر الـ log (باش ما تحتاجش تسكرول فالهاتف)
      - name: Show build errors
        if: failure()
        run: |
          cd AndroidIDE
          echo "===== What went wrong ====="
          grep -n -A12 "What went wrong" build.log | head -60 || true
          echo "===== Kotlin / Java / AAPT errors ====="
          grep -nE "^e: |error: |AAPT" build.log | head -30 || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidide-ai-apk
          path: AndroidIDE/core/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: AndroidIDE/build.log
          if-no-files-found: warn
