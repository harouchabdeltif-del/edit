name: Build AndroidIDE with AI assistant

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK command line tools
        run: |
          set -eux
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install required Android SDK packages
        run: |
          set -eux
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;26.1.10909125" \
            "extras;android;m2repository" \
            "cmake;3.22.1" \
            "lldb;14.0.6"

      - name: Clone AndroidIDE
        run: |
          git clone https://github.com/AndroidIDEOfficial/AndroidIDE.git AndroidIDE

      - name: Verify inject-ai.sh exists
        run: |
          test -f inject-ai.sh
          chmod +x inject-ai.sh
          ls -l inject-ai.sh

      - name: Inject AI assistant
        run: |
          bash inject-ai.sh AndroidIDE

      - name: Fix tree-sitter / unavailable SNAPSHOT dependency
        run: |
          cd AndroidIDE
          find . -type f \( -name "*.toml" -o -name "*.kts" -o -name "*.gradle" -o -name "*.gradle.kts" \) \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec sed -i \
              -E 's/4\.0\.1-internal\.1[^"]*/4.0.1/g; s/4\.0\.1-internal\.1[^[:space:]]*/4.0.1/g' {} \;

      - name: Build debug APK
        run: |
          cd AndroidIDE
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace 2>&1 | tee build.log

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidide-ai-apk
          path: AndroidIDE/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: AndroidIDE/build.log
          if-no-files-found: warn
