name: Build AndroidIDE with AI assistant

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (to get inject-ai.sh)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # الريبو فيه submodule (logback-android) => لازم --recurse-submodules
      # ما كنستعملوش --depth 1 حيث المشروع كيستعمل plugin Nyx اللي كيحتاج تاريخ git
      - name: Clone AndroidIDE
        run: git clone --recurse-submodules https://github.com/AndroidIDEOfficial/AndroidIDE.git AndroidIDE

      - name: Inject AI assistant
        run: |
          test -f inject-ai.sh || { echo "inject-ai.sh ماكاينش فجذر الريبو"; ls -la; exit 1; }
          bash inject-ai.sh AndroidIDE
          echo "--- الملفات المعدّلة:"
          git -C AndroidIDE status --short | head -20

      - name: Replace unavailable SNAPSHOT dependency with 4.0.1
        run: |
          cd AndroidIDE
          grep -rl "4.0.1-internal.1" --include=*.toml --include=*.kts --include=*.kt --include=*.gradle --exclude-dir=build --exclude-dir=.git . | tee /dev/stderr | xargs -r sed -i -E 's/4\.0\.1-internal\.1[^"]*SNAPSHOT/4.0.1/g'

      - name: Install Android SDK pieces
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('AndroidIDE/**/*.gradle*', 'AndroidIDE/**/gradle-wrapper.properties', 'AndroidIDE/**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          cd AndroidIDE
          chmod +x gradlew
          ./gradlew :core:app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidide-ai-apk
          path: AndroidIDE/core/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: AndroidIDE/build.log
          if-no-files-found: warn
